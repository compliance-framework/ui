name: ci

on:
  pull_request:
    # edited re-runs the PR title check after a title edit; labeled/unlabeled re-run
    # release-checks when release:major-approved changes.
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    uses: compliance-framework/workflows/.github/workflows/ci-ui.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    with:
      # The unit tests are the test:unit script (Vitest), not test.
      test-script: test:unit
      # The vendored agentconfig conformance file must match the API's main (a notice, not a
      # failure, while the API has not published it yet). Not in `make reviewable`: it needs
      # the network.
      extra-command: scripts/sync-agentconfig-conformance.sh --check main
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    # Acts only on release-please--* PRs; skipped (counts as passing) elsewhere.
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@aafa1649ac6f33c02c581486c50f9cf04cc0eb54 # v1.9.1
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
