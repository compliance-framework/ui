name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # ghcr.io/compliance-framework/ui, linux/amd64 and linux/arm64: :X.Y.Z, :X.Y, :X and :latest
    # for a final release, :X.Y.Z-rcN only for a pre-release.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    with:
      images: '[{"name": "ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
