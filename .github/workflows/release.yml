name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # ghcr.io/compliance-framework/ui, linux/amd64 and linux/arm64: :X.Y.Z, :X.Y, :X and :latest
    # for a final release, :X.Y.Z-rcN only for a pre-release.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@1e188815a0e8036da1bea4e637a9973ecdc3ae1c # v1.9.0
    with:
      images: '[{"name": "ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
