name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # ghcr.io/compliance-framework/ui, linux/amd64 and linux/arm64: :X.Y.Z, :X.Y, :X and :latest
    # for a final release, :X.Y.Z-rcN only for a pre-release.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@e85d35af2af2ddfcd4b92061d2063e665c1831f6 # v1.7.0
    with:
      images: '[{"name": "ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
